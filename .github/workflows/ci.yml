name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # ffmpeg/ffprobe run for real in the tests (format conversion, chunking, security checks)
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t transcriber .
      - name: Smoke test
        run: |
          docker run -d --name svc -p 8000:8000 transcriber
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
          # a fake audio file must be rejected with 422, not crash the service
          echo "not audio" > fake.mp3
          test "$(curl -s -o /dev/null -w '%{http_code}' -F 'file=@fake.mp3' localhost:8000/transcribe)" = "422"
